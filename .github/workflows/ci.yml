name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Shell syntax checks
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n doctor.sh
          bash -n scripts/test-linux.sh

      - name: Linux install/panel/uninstall test
        run: bash scripts/test-linux.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Node syntax checks
        shell: pwsh
        run: |
          node --check agent-board/server.mjs
          $html = Get-Content agent-board/index.html -Raw
          $match = [regex]::Match($html, '(?s)<script>(.*?)</script>')
          if (-not $match.Success) { throw "index.html script block not found" }
          Set-Content -Path panel-script.js -Value $match.Groups[1].Value -Encoding utf8
          node --check panel-script.js
          node --check scripts/install-config.mjs
          node --check scripts/test-panel.mjs
          node --check scripts/test-board-guard.mjs

      - name: PowerShell parse checks
        shell: pwsh
        run: |
          $files = @(
            "install.ps1",
            "install-gui.ps1",
            "update.ps1",
            "doctor.ps1",
            "scripts/release.ps1",
            "scripts/build-launcher.ps1",
            "scripts/build-icon.ps1",
            "scripts/sign.ps1",
            "scripts/verify-release.ps1",
            "agent-board/diagnostic.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              throw "PowerShell parse failed: $file"
            }
          }

      - name: Shell syntax check
        shell: bash
        run: bash -n install.sh

      - name: Installer smoke test
        shell: pwsh
        run: |
          $temp = Join-Path $env:TEMP "kit-ci-install"
          if (Test-Path $temp) { Remove-Item $temp -Recurse -Force }
          powershell -NoProfile -ExecutionPolicy Bypass -File install.ps1 -ConfigDir $temp -NoShortcuts -NoStart -NoModelPrompt
          if (-not (Test-Path (Join-Path $temp "opencode.json"))) { throw "opencode.json missing" }
          if (-not (Test-Path (Join-Path $temp "oh-my-opencode-slim.json"))) { throw "oh-my-opencode-slim.json missing" }
          if (-not (Test-Path (Join-Path $temp "agent-board\server.mjs"))) { throw "agent-board/server.mjs missing" }
          $opencode = Get-Content (Join-Path $temp "opencode.json") -Raw | ConvertFrom-Json
          if (@($opencode.plugins) -notcontains "oh-my-opencode-slim@3.0.7") { throw "plugin missing" }
          if ($opencode.default_agent -ne "orchestrator") { throw "default_agent missing" }
          $omo = Get-Content (Join-Path $temp "oh-my-opencode-slim.json") -Raw | ConvertFrom-Json
          if ($omo.preset -ne "session") { throw "expected session preset" }
          if ($omo.stripOrchestratorModel -ne $true) { throw "stripOrchestratorModel missing" }

      - name: Config merge tests
        shell: pwsh
        run: |
          $root = Join-Path $env:TEMP "kit-ci-merge"
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $existing = Join-Path $root "opencode.json"
          '{"model":"my-provider/my-model","theme":"dark"}' | Set-Content $existing -Encoding utf8
          node scripts/install-config.mjs opencode $existing config/opencode.json
          $merged = Get-Content $existing -Raw | ConvertFrom-Json
          if ($merged.model -ne "my-provider/my-model") { throw "model was not preserved" }
          if (@($merged.plugins) -notcontains "oh-my-opencode-slim@3.0.7") { throw "plugin was not merged" }

          $omoTarget = Join-Path $root "oh-my-opencode-slim.json"
          '{"preset":"opencode-go"}' | Set-Content $omoTarget -Encoding utf8
          node scripts/install-config.mjs omo $omoTarget config/oh-my-opencode-slim.json
          $omo = Get-Content $omoTarget -Raw | ConvertFrom-Json
          if ($omo.preset -ne "opencode-go") { throw "preset was not preserved" }
          if ($omo.presets.session -eq $null) { throw "session preset missing" }

          node scripts/install-config.mjs model $existing "opencode-go/deepseek-v4.1-flash"
          $withModel = Get-Content $existing -Raw | ConvertFrom-Json
          if ($withModel.model -ne "opencode-go/deepseek-v4.1-flash") { throw "model write failed" }

      - name: Launcher and packaging validation
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release.ps1 -Version $version
          if (-not (Test-Path "dist\launcher\OpenCodeOrchestratorKit.exe")) { throw "launcher missing" }
          if (-not (Test-Path "dist\opencode-orchestrator-kit-v$version.zip")) { throw "release zip missing" }
          $zipVersion = tar -xOf "dist\opencode-orchestrator-kit-v$version.zip" VERSION
          if ($zipVersion.Trim() -ne $version) { throw "zip VERSION mismatch" }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-release.ps1 -Version $version
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            winget validate --manifest "dist\packaging\trpamuk.OpenCodeOrchestratorKit.yaml"
            if ($LASTEXITCODE -ne 0) { throw "winget validation failed" }
          } else {
            Write-Host "winget not available; skipping manifest validation"
          }

      - name: Code-signing smoke test
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=OpenCode Orchestrator Kit CI" -KeyExportPolicy Exportable -KeyUsage DigitalSignature -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddDays(1)
          try {
            $target = Join-Path $env:RUNNER_TEMP "launcher-signed.exe"
            Copy-Item "dist\launcher\OpenCodeOrchestratorKit.exe" $target
            powershell -NoProfile -ExecutionPolicy Bypass -File scripts/sign.ps1 -Thumbprint $cert.Thumbprint -File $target -TimestampServer none -AllowUntrusted
            $signature = Get-AuthenticodeSignature $target
            if (-not $signature.SignerCertificate) { throw "signature missing" }
            if ($signature.SignerCertificate.Thumbprint -ne $cert.Thumbprint) { throw "wrong signer" }
            Write-Host "Signature status: $($signature.Status)"
          } finally {
            Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.Subject -eq "CN=OpenCode Orchestrator Kit CI" } | Remove-Item -Force -ErrorAction SilentlyContinue
          }

      - name: Panel API tests
        shell: pwsh
        run: node scripts/test-panel.mjs

      - name: Board Guard tests
        shell: pwsh
        run: node scripts/test-board-guard.mjs

      - name: Server smoke test
        shell: pwsh
        run: |
          $env:AGENT_BOARD_PORT = "43125"
          $env:AGENT_BOARD_OMO_CONFIG = Join-Path $env:TEMP "kit-ci-missing-omo.json"
          $process = Start-Process -FilePath "node" -ArgumentList "agent-board/server.mjs" -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 2
            $health = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:43125/health" -TimeoutSec 10
            if ($health.Content -ne "ok") { throw "health failed" }
            $page = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:43125/" -TimeoutSec 10
            if ($page.Content -notmatch 'name="panel-token" content="[a-f0-9]{48}"') { throw "panel token missing" }
            $server = Get-Content agent-board/server.mjs -Raw
            foreach ($endpoint in @("/api/models", "/api/profile", "/api/session-detail", "/api/update", "/api/diagnostic", "/api/guard-log", "/api/archive-board", "/api/retry", "/api/model-test")) {
              if ($server -notmatch [regex]::Escape($endpoint)) { throw "endpoint missing: $endpoint" }
            }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
